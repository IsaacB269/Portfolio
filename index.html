<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceuil</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>

  <!-- Section d'accroche -->
<section class="container py-5 text-center">
  <h1 class="display-4 fw-bold">Bonjour, je suis <span id="typed-text"></span><span class="cursor">|</span></h1>
  <p class="lead text-muted mt-3">Développeur web créatif — je conçois des interfaces modernes et accessibles.</p>
  <div class="mt-4">
    <a href="projects.html" class="btn btn-dark me-3">Voir mes projets</a>
    <a href="contact.html" class="btn btn-outline-dark">Me contacter</a>
  </div>
</section>
  
    <script>
  const mots = ["Othmane.", "un développeur.", "un créatif."];
  let mi = 0, ci = 0, del = false;
  const el = document.getElementById('typed-text');
  function type() {
    const mot = mots[mi];
    el.textContent = del ? mot.slice(0, --ci) : mot.slice(0, ++ci);
    if (!del && ci === mot.length) setTimeout(() => { del = true; type(); }, 1200);
    else if (del && ci === 0) { del = false; mi = (mi + 1) % mots.length; setTimeout(type, 300); }
    else setTimeout(type, del ? 40 : 80);
  }
  type();
</script>
</body>
</html>
